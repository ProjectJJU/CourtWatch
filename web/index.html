<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>빈 코트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=release5">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">Court Watch</p>
        <h1>빈 코트</h1>
      </div>
      <div class="top-bar">
        <p id="message" class="message" role="status"></p>
        <div class="icon-bar">
          <button type="button" class="icon-button save-button" id="save-top" hidden title="저장" aria-label="저장">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5V4zm3 0v5h7V4M8 14h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-button" id="tools-button" title="테스트" aria-label="테스트" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3l3 3M4 20l6.5-1.5L19 10a2.1 2.1 0 0 0-3-3L7.5 15.5 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-button" id="account-button" title="계정" aria-label="계정" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v1h14v-1c0-2-3-4-7-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="account-dot" class="dot" hidden></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="panel status-panel" id="status-card">
        <div class="panel-head">
          <h2>최근 검사</h2>
          <span class="pulse" id="status-pulse" hidden></span>
        </div>
        <div id="status" class="status">검사 기록을 불러오는 중입니다.</div>
      </section>

      <p class="guest-note" id="guest-note">설정을 고치려면 오른쪽 위 계정 아이콘으로 로그인하세요.</p>

      <section class="panel global-panel" id="general-card" hidden>
        <div id="general-detail"></div>
      </section>

      <section class="workspace" id="workspace" hidden>
        <aside class="rail panel">
          <div class="panel-head">
            <h2>그룹</h2>
          </div>
          <div id="group-list" class="group-list"></div>
          <div class="add-row compact">
            <input id="add-group-name" placeholder="새 그룹" autocomplete="off">
            <button type="button" id="add-group-button" class="ghost">추가</button>
          </div>
        </aside>

        <section class="panel detail-panel">
          <div id="group-detail"></div>
          <div class="save-footer">
            <button type="button" class="save-button primary" hidden>저장</button>
          </div>
        </section>
      </section>
    </main>
  </div>

  <dialog class="sheet" id="account-sheet">
    <div class="sheet-head">
      <h2>계정</h2>
      <button type="button" class="icon-button sheet-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="hint">코트와 감시 시간을 고칠 때만 로그인합니다. 최근 검사는 로그인 없이도 보입니다.</p>
    <p id="account-message" class="sheet-message" role="status"></p>
    <form id="sign-in-form" class="stack">
      <div class="field">
        <span class="field-label">이메일</span>
        <div class="field-row">
          <input id="email" type="email" value="jinid231@gmail.com" autocomplete="username" readonly>
          <button type="button" id="email-edit-button" class="icon-button" title="이메일 수정" aria-label="이메일 수정" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.5-1.2L19 8.3a2 2 0 0 0-2.8-2.8L5.7 16.3 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"></label>
      <button type="submit" id="sign-in-button" class="primary">로그인</button>
    </form>
    <div class="stack" id="signed-in-box" hidden>
      <p id="account" class="account-email"></p>
      <button type="button" id="sign-out-button" class="secondary">로그아웃</button>
    </div>
  </dialog>

  <dialog class="sheet" id="tools-sheet">
    <div class="sheet-head">
      <h2>테스트</h2>
      <button type="button" class="icon-button sheet-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p id="tools-message" class="sheet-message" role="status"></p>
    <section class="sheet-block">
      <h3>이 화면에서 빈 시간 보기</h3>
      <p class="hint">알림 없이, 마지막 검사 기록으로만 계산합니다.</p>
      <form id="check-form" class="add-row">
        <input id="check-word" autocomplete="off" placeholder="체크">
        <button type="submit" class="ghost">확인</button>
      </form>
      <div id="check-result"></div>
    </section>
    <section class="sheet-block">
      <h3>알림 테스트</h3>
      <p class="hint">이 브라우저에만 남습니다. 1분 검사가 쓰는 토픽은 GitHub에 따로 있습니다.</p>
      <div class="stack">
        <label>ntfy 토픽<input id="topic" autocomplete="off" placeholder="긴 임의 이름"></label>
        <label>ntfy 토큰<input id="ntfy-token" type="password" autocomplete="off" placeholder="잠근 토픽만"></label>
        <button type="button" id="test-button" class="secondary">테스트 알림 보내기</button>
      </div>
    </section>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="config.js?v=release4"></script>
  <script src="check.js?v=release4"></script>
  <script src="app.js?v=release5"></script>
</body>
</html>
